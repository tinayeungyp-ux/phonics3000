<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200"><style>
.jmp{animation:jmp 1s infinite;transform-origin:90px 186px}
.shd{animation:shd 1s infinite;transform-origin:90px 184px}
.mot{animation:mot 1s infinite}
.spk{animation:spk 1s infinite;transform-box:fill-box;transform-origin:center}
@keyframes jmp{
 0%{transform:translateY(0) scale(1,1);animation-timing-function:ease-in-out}
 12%{transform:translateY(0) scale(1.12,.88);animation-timing-function:ease-out}
 26%{transform:translateY(-10px) scale(.92,1.1);animation-timing-function:ease-out}
 50%{transform:translateY(-26px) scale(1,1);animation-timing-function:ease-in}
 74%{transform:translateY(-10px) scale(.94,1.07);animation-timing-function:ease-in}
 86%{transform:translateY(0) scale(1.14,.86);animation-timing-function:ease-out}
 100%{transform:translateY(0) scale(1,1)}}
@keyframes shd{0%,12%,86%,100%{transform:scale(1);opacity:1}50%{transform:scale(.55);opacity:.5}}
@keyframes mot{0%,20%{opacity:0}32%,40%{opacity:1}55%,100%{opacity:0}}
@keyframes spk{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.15);opacity:1}}
